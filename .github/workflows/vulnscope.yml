name: VulnScope Security Gate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 4 * * 1'  # Every Monday at 04:00 UTC

jobs:
  security-audit:
    name: Automated Web Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install VulnScope Dependencies
        run: |
          pip install requests cryptography

      - name: Run VulnScope Scan
        run: |
          python scan.py "${{ secrets.TARGET_URL || 'http://127.0.0.1:8080' }}" \
            --authorized \
            --formats html,json,sarif \
            --out reports

      - name: Upload SARIF Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/
          category: vulnscope-security-assessment

      - name: Archive HTML & PDF Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnscope-security-reports
          path: reports/
